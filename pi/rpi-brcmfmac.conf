# Overrides /usr/lib/modprobe.d/rpi-brcmfmac.conf from firmware-brcm80211
# (same file name in /etc wins). Raspberry Pi OS ships
#   options brcmfmac roamoff=1 feature_disable=0x282000
# which masks FWSUP (bit 13), SAE (19) and DUMP_OBSS (21) on the BCM43430 of
# the Zero 2 W, but not SAE_EXT (bit 25). The firmware still advertises
# external WPA3 SAE, NetworkManager then selects SAE on a WPA2/WPA3 AP, and
# every join ends in "Authentication timed out" before the AP logs the
# client. Adding bit 25 makes wpa_supplicant negotiate plain WPA2-PSK.
# Installed by pi/install.sh and baked into the initramfs.
options brcmfmac roamoff=1 feature_disable=0x02282000
